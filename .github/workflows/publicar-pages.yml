name: Publicar aulas no GitHub Pages
on:
  push:
    branches: [main]
    paths: ['aulas/**', 'laboratorios/**', 'projetos/**', 'publicacao/**', 'ferramentas/conferir-slides.cjs', '.github/workflows/publicar-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.19'
      - name: Preparar somente os materiais públicos
        run: python publicacao/preparar.py
      - name: Conferir os slides no navegador
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium --with-deps
          mkdir -p exportacoes/projetos/demonstracao-slides/revealjs
          cp _site/slides/aprender-a-aprender/index.html exportacoes/projetos/demonstracao-slides/revealjs/index.html
          node ferramentas/conferir-slides.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
