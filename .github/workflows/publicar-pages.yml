name: Validar aulas antes da publicação
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.19'
      - name: Conferir catálogo e diretrizes
        run: |
          python biblioteca-arquiteturas/validar_catalogo.py
          python banco-pedagogico/validar.py
      - name: Preparar somente os materiais públicos
        run: python publicacao/preparar.py
      - name: Conferir os slides no navegador
        timeout-minutes: 5
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
          mkdir -p exportacoes/projetos/demonstracao-slides/revealjs
          cp _site/slides/aprender-a-aprender/index.html exportacoes/projetos/demonstracao-slides/revealjs/index.html
          node ferramentas/conferir-slides.cjs
      - name: Conferir portal e organização do acervo
        run: node ferramentas/conferir-portal.cjs
      - name: Conferir área docente com serviço simulado
        run: node ferramentas/conferir-area-docente.cjs
      - name: Conferir laboratório Conectar e investigar
        timeout-minutes: 5
        run: node ferramentas/conferir-conectar.cjs
      - name: Conferir fontes e layout nos materiais HTML
        timeout-minutes: 5
        run: node ferramentas/conferir-leitura.cjs
      - name: Conferir acesso por imagens e voz
        timeout-minutes: 5
        run: node ferramentas/conferir-imagens.cjs
      - name: Guardar imagens do apoio visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conferencia-aprender-com-imagens
          path: imagens-*.png
          if-no-files-found: ignore
      - name: Guardar imagens do painel de leitura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conferencia-fontes-layout
          path: leitura-*.png
          if-no-files-found: ignore
      - name: Guardar imagens de conferência do laboratório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conferencia-conectar-investigar
          path: lab-*.png
          if-no-files-found: ignore
      - name: Conferir História 192 de 29 de outubro
        run: node ferramentas/conferir-historia-192.cjs
      - name: Conferir Lettering Digital escolar nas duas aulas de História 192
        run: node ferramentas/conferir-lettering.cjs
      - name: Guardar imagens da História 192
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conferencia-historia-192
          path: historia-192-*.png
          if-no-files-found: ignore
      - name: Conferir Missão Ponte do sexto e sétimo ano
        run: node ferramentas/conferir-ponte.cjs
      - name: Conferir entrada obrigatória e coleta do piloto (receptor simulado)
        run: |
          node coleta/supabase/receptor/testes.mjs
          node ferramentas/conferir-coleta-piloto.cjs
      - name: Conferir transporte integral e abertura segura dos relatórios
        run: |
          node ferramentas/testar-email.cjs
          node ferramentas/conferir-email.cjs
      - name: Conferir Matemática demonstrativa
        run: node ferramentas/conferir-medidas.cjs
      - name: Conferir Português no layout de referência
        run: node ferramentas/conferir-portugues.cjs
      - name: Conferir seleção, volume e parada dos ruídos de fundo
        run: node ferramentas/conferir-sons.cjs
      - name: Confirmar integridade do pacote público
        run: |
          test -s _site/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          for item in json.loads(Path('publicacao/catalogo.json').read_text())['materiais']:
              if item['tipo'] != 'link':
                  path = Path('_site') / item['destino'] / 'index.html'
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit('Material não empacotado: '+str(path))
          print('Todos os materiais locais constam do pacote público.')
          PY
