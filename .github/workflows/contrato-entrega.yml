name: Conferir Prompt Mestre e entrega integral
on:
  push:
    paths: ['PROMPT_MESTRE_AULAS_DIGITAIS.md', 'MEMORIA_OPERACIONAL_AULAS.md', 'automacoes/aulas/**', 'publicacao/portal/**']
  pull_request:
    paths: ['PROMPT_MESTRE_AULAS_DIGITAIS.md', 'automacoes/aulas/**', 'publicacao/portal/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependência de QR para ensaios
        run: python -m pip install "qrcode[pil]==8.2"
      - name: Conferir bloqueios e reutilização
        run: |
          python -m unittest discover -s automacoes/aulas -p 'test_entrega.py' -v
          python automacoes/aulas/testar_gerador.py
          python -m py_compile automacoes/aulas/gerar.py automacoes/aulas/validar_gerados.py publicacao/portal/gerar.py
          node --check publicacao/portal/portal.js
