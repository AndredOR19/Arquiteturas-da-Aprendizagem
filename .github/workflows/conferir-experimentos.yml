name: Ensaios de interface e circuitos quanticos
on:
  push:
    branches: [main]
    paths: ['pesquisa/simulacoes/**', '.github/workflows/conferir-experimentos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pesquisa/simulacoes/requirements.txt
      - run: python pesquisa/simulacoes/testes_experimentos.py
      - run: python pesquisa/simulacoes/experimentos.py --saida exportacoes/ensaios
      - uses: actions/upload-artifact@v4
        with:
          name: ensaios-formais-${{ github.run_id }}
          path: exportacoes/ensaios/
          if-no-files-found: error
          retention-days: 14
