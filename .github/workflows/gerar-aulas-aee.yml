name: Encaminhar pedido à estação privada
on:
  workflow_dispatch:
    inputs:
      pedido:
        description: Arquivo JSON do pedido no repositório pedagógico
        required: true
        type: string
      script:
        description: Roteiro opcional .md
        required: false
        type: string
      gerar_dados:
        description: Usar provedor de autoria se não houver dados preparados
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  encaminhar:
    runs-on: ubuntu-24.04
    steps:
      - name: Acionar produção privada sem expor guias ou motores
        env:
          GH_TOKEN: ${{ secrets.BIBLIOTECA_EXEC_TOKEN }}
          PEDIDO: ${{ inputs.pedido }}
          ROTEIRO: ${{ inputs.script }}
          GERAR: ${{ inputs.gerar_dados }}
        run: |
          test -n "$GH_TOKEN" || { echo "Produção pendente: configurar BIBLIOTECA_EXEC_TOKEN com Actions:write somente na biblioteca privada"; exit 1; }
          python - <<'PY'
          import json,os,subprocess
          payload={'ref':'main','inputs':{'pedido':os.environ['PEDIDO'],'roteiro':os.environ['ROTEIRO'],'gerar_dados':os.environ['GERAR']}}
          subprocess.run(['gh','api','--method','POST','repos/AndredOR19/Biblioteca-de-Diagramacao/actions/workflows/aulas-integrais.yml/dispatches','--input','-'],input=json.dumps(payload),text=True,check=True)
          print('Pedido encaminhado; acompanhar a execução privada. Isto não confirma produção ou publicação.')
          PY
