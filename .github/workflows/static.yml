# Publicacao segura de materiais discentes e da Gincana ERER.
# Nunca publicar a raiz do repositorio: pode conter material docente e operacional.
name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quarto para renderizar apresentacoes
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"
      - name: Dependencias da Gincana ERER
        run: python -m pip install --disable-pip-version-check "qrcode[pil]==8.2" "reportlab==4.4.4" "pypdf==6.3.0"
      - name: Validar catalogo e preparar acervo publico
        run: |
          python biblioteca-arquiteturas/validar_catalogo.py
          python publicacao/preparar.py
      - name: Construir e incluir Gincana ERER nos caminhos originais
        run: |
          python gincana-erer/build.py
          mkdir -p _site/gincana-erer
          cp gincana-erer/index.html _site/gincana-erer/index.html
          cp gincana-erer/*.pdf _site/gincana-erer/
          cp -R gincana-erer/qr_codes _site/gincana-erer/qr_codes
      - name: Validar JavaScript interativo da Gincana
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          page = Path('_site/gincana-erer/index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script>(.*?)</script>', page, re.I | re.S)
          if not matches:
              raise SystemExit('ERRO: JavaScript ausente da gincana')
          for i, script in enumerate(matches):
              path = Path(f'/tmp/gincana-script-{i}.js')
              path.write_text(script, encoding='utf-8')
              subprocess.run(['node', '--check', str(path)], check=True)
          PY
      - name: Bloquear fontes internas e preservar QR Codes
        run: |
          test -s _site/index.html
          test -s _site/gincana-erer/index.html
          test -s _site/gincana-erer/Manual_Completo_Com_QR_Codes.pdf
          for path in PROMPT_MESTRE_AULAS_DIGITAIS.md AGENTS.md docentes/README.md coleta/STATUS.json prompts/README.md HISTORICO_APERFEICOAMENTOS.md docentes/PROTOCOLO_IA.md pesquisa/README.md publicacao/VERCEL.md publicacao/catalogo.json; do
            if test -e "_site/$path"; then
              echo "ERRO: conteudo interno no pacote publico: $path" >&2
              exit 1
            fi
          done
      - name: Verificar todas as aulas no pacote final
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalogo = json.loads(Path("publicacao/catalogo.json").read_text())
          for item in catalogo["materiais"]:
              if item["tipo"] == "link":
                  continue
              pagina = Path("_site") / item["destino"] / "index.html"
              if not pagina.is_file() or pagina.stat().st_size == 0:
                  raise SystemExit(f"FALHA: aula ausente do pacote de publicação: {pagina}")
          print("Publicação consistente: todas as aulas do catálogo estão no pacote.")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload apenas o pacote publico
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Conferir versão nos dois destinos e gerar QR verificado
        env:
          PAGES_BASE: ${{ steps.deployment.outputs.page_url }}
          VERCEL_BASE: ${{ vars.VERCEL_BASE_URL || 'https://arquiteturas-aulas.vercel.app' }}
        run: python automacoes/aulas/conferir_publicacao_integral.py --pages "$PAGES_BASE" --vercel "$VERCEL_BASE"
      - name: Preservar recibos públicos e QR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publicacao-integral-${{ github.sha }}
          path: verificacao-publicacao/
          if-no-files-found: ignore
          retention-days: 30
