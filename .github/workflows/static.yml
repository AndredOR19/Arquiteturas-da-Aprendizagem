# Publicacao segura de materiais discentes e da Gincana ERER.
# Nunca publicar a raiz do repositorio: pode conter material docente e operacional.
name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quarto para renderizar apresentacoes
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"
      - name: Dependencias da Gincana ERER
        run: python -m pip install --disable-pip-version-check "qrcode[pil]==8.2" "reportlab==4.4.4" "pypdf==6.3.0"
      - name: Validar catalogo e preparar acervo publico
        run: |
          python biblioteca-arquiteturas/validar_catalogo.py
          python publicacao/preparar.py
      - name: Construir e incluir Gincana ERER nos caminhos originais
        run: |
          python gincana-erer/build.py
          mkdir -p _site/gincana-erer
          cp gincana-erer/index.html _site/gincana-erer/index.html
          cp gincana-erer/*.pdf _site/gincana-erer/
          cp -R gincana-erer/qr_codes _site/gincana-erer/qr_codes
      - name: Bloquear fontes internas e preservar QR Codes
        run: |
          test -s _site/index.html
          test -s _site/gincana-erer/index.html
          test -s _site/gincana-erer/Manual_Completo_Com_QR_Codes.pdf
          for path in PROMPT_MESTRE_AULAS_DIGITAIS.md AGENTS.md docentes/README.md coleta/STATUS.json prompts/README.md; do
            if test -e "_site/$path"; then
              echo "ERRO: conteudo interno no pacote publico: $path" >&2
              exit 1
            fi
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload apenas o pacote publico
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
