<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Conferência das aulas</title><style>body{font-family:system-ui;background:#e6e8e6}iframe{display:block;height:900px;border:2px solid;margin:20px 0}.mobile{width:390px}.desktop{width:1366px}</style><h1>Conferência de telas</h1><select id="tema"></select><button id="principal">Principal</button><button id="apoio">Imagens e palavras</button><iframe class="mobile" title="Celular 390 px"></iframe><iframe class="desktop" title="Desktop 1366 px"></iframe><script>const temas=["povos-indigenas-territorios-1serie", "fracoes-medidas-6ano", "misturas-separacao-9ano", "participacao-cidada-2serie", "protecao-digital-8ano"];const q=new URLSearchParams(location.search);const sel=document.querySelector('select');for(const slug of temas){const o=document.createElement('option');o.value=slug;o.textContent=slug;sel.append(o);}sel.value=q.get('tema')||temas[0];let rota=q.get('rota')||'';function abrir(){for(const f of document.querySelectorAll('iframe'))f.src='../../aulas/'+sel.value+'/'+rota;}sel.onchange=abrir;document.querySelector('#principal').onclick=()=>{rota='';abrir()};document.querySelector('#apoio').onclick=()=>{rota='apoio/';abrir()};abrir();</script></html>
